[package]
name = "bevy-schedule-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
analysis-contract = { path = "../rustc-analysis/contract" }
bevy_app = "0.20"
bevy_ecs = { version = "0.20", features = ["debug"] }
bevy_extract = "0.20"
bevy_log = "0.20"
bevy_mod_debugdump = { version = "=0.17.0", default-features = false }
bevy_tasks = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
