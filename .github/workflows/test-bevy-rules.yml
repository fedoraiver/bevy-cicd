name: Validate Bevy compiler rules

on:
  pull_request:
    paths:
      - '.github/workflows/bevy-rules.yml'
      - '.github/workflows/rust-checks.yml'
      - '.github/workflows/test-bevy-rules.yml'
      - 'rust-toolchain.toml'
      - 'scripts/rustc-analysis.sh'
      - 'examples/bevy-rules/**'
      - 'tools/**'
  push:
    paths:
      - '.github/workflows/bevy-rules.yml'
      - '.github/workflows/rust-checks.yml'
      - '.github/workflows/test-bevy-rules.yml'
      - 'rust-toolchain.toml'
      - 'scripts/rustc-analysis.sh'
      - 'examples/bevy-rules/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Check Rust with optional features
    uses: ./.github/workflows/rust-checks.yml
    with:
      project-path: examples/bevy-rules
      features: extra

  caller:
    name: Check a Bevy project
    uses: ./.github/workflows/bevy-rules.yml
    with:
      package-path: examples/bevy-rules
      features: extra

  regressions:
    name: Compiler and rule regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out compiler sources
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Run compiler and rule regressions
        shell: bash
        run: bash scripts/rustc-analysis.sh test

      - name: Validate headless Bevy schedule export
        run: |
          cargo fmt --manifest-path tools/bevy-schedule-export/Cargo.toml --all -- --check
          cargo test --locked --manifest-path tools/bevy-schedule-export/Cargo.toml

      - name: Detect violations in a Bevy project
        shell: bash
        run: |
          package="$GITHUB_WORKSPACE/examples/bevy-rules"
          for rule in entity-names named-fields; do
            status=0
            output=$(bash scripts/rustc-analysis.sh check --rule "$rule" --workspace "$package" --features violations 2>&1) || status=$?
            printf '%s\n' "$output"
            if [[ "$status" != 1 ]]; then
              echo "::error::Expected a $rule violation (exit 1), received exit $status."
              exit 1
            fi
            case "$rule" in
              entity-names) grep -F 'error[entity-name]' <<< "$output" ;;
              named-fields) grep -F 'error[named-fields]' <<< "$output" ;;
            esac
          done
