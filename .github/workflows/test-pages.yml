name: Validate Pages publication proof

on:
  pull_request:
    paths:
      - '.github/workflows/*pages.yml'
      - 'scripts/*verify_pages.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*pages.yml'
      - 'scripts/*verify_pages.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Pages proof verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p test_verify_pages.py
